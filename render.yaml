services:
  - type: web
    name: bcn-civic-vision-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: LLM_MAX_TOKENS
        value: "600"
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        value: "https://api.jina.ai/v1"
      - key: EMBEDDING_MODEL
        value: "jina-embeddings-v3"
      - key: CHROMA_N_RESULTS
        value: "8"
      - key: FINAL_CONTEXT_CHUNKS
        value: "3"
      - key: ENABLE_PAGEINDEX
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /api/health
