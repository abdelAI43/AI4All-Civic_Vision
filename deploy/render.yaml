services:
  - type: web
    name: bcn-civic-vision-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LLM_API_KEY
        sync: false  # Groq key — set manually in Render dashboard
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_API_KEY
        sync: false  # Jina AI key — set manually in Render dashboard
      - key: EMBEDDING_BASE_URL
        value: "https://api.jina.ai/v1"
      - key: EMBEDDING_MODEL
        value: "jina-embeddings-v3"
      - key: ENABLE_PAGEINDEX
        value: "false"
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /api/health
