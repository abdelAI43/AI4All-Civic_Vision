server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Draft proposals carry a base64-encoded generated image in the publish
    # request body, which is well over nginx's 1m default.
    client_max_body_size 20m;

    # Kiosk readiness probe (served by nginx itself — no app dependency).
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }

    # Forward API calls to the Node api container (service name "api").
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Image generation + RAG can be slow; don't cut the request short.
        proxy_connect_timeout 150s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    # SPA fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
